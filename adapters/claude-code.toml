# Claude Code 适配器。格式说明见 adapters/README.md。
#
# 2026-11-14 对照 Claude Code 当期文档核实：
#   https://code.claude.com/docs/en/skills
#   https://code.claude.com/docs/en/memory
#   https://code.claude.com/docs/en/mcp
# 会话记录的格式对照本机 ~/.claude/projects 下的实际文件核实。
#   https://code.claude.com/docs/en/plugins-reference
# 插件自带的 skill 与 MCP 只计数，写在「其他加载项」里。
# 不读的：--add-dir 加进来的目录。它是启动会话时的参数，各次会话不同，静态扫描读不到（settings 里的
# permissions.additionalDirectories 只给文件权限，不加载 skill）。
# 项目 skill 会从启动目录往上找到仓库根。方寸的项目就是 git 根目录，往上找等于不找；monorepo 的子项目再补。
schema = 1

[tool]
id = "claude-code"
name = "Claude Code"
support = "full"

[capabilities]
# skills 文档：个人与项目位置的 skill 目录可以是软链，读目标里的 SKILL.md，多处指向同一目标只加载一次。
follows-symlinks = true
# mcp 文档：项目层是项目根目录的 .mcp.json。
project-mcp = true
# skills 文档：项目的 .claude/settings.json（个人用 settings.local.json）里 skillOverrides 把某个 skill 设 "off"，
# 名称与描述都不进上下文。只按名字匹配：2026-11-21 实测（H-11，claude 2.1.329），全局与项目同名时
# 项目 settings.json 设 off，两份一起消失，项目那份不会顶上来。
# 开关的位置见下面「skill 开关」「MCP 开关」。
per-project-disable = true

# ── Skills ──
# 只有名称与描述常驻，全文在触发时才加载。

[[skills]]
scope = "global"
path = "~/.claude/skills"

# 企业托管：managed settings 目录下的 .claude/skills。这里是 macOS 的位置。
# 同名时企业优先于个人；两者在方寸里都算全局层。
[[skills]]
scope = "global"
path = "/Library/Application Support/ClaudeCode/.claude/skills"

[[skills]]
scope = "project"
path = ".claude/skills"

# ── 指令文件 ──
# 工作目录和它上面每一层的 CLAUDE.md、.claude/CLAUDE.md、CLAUDE.local.md 全部拼接，不互相覆盖。
# 这几个文件一个都没有时，改读每一层的 AGENTS.md 与 .claude/AGENTS.md。
# ~/.claude/CLAUDE.md 不影响这个判断，总是加载。

# 企业托管的 CLAUDE.md（macOS）先于用户级加载。文件里的 @路径 会把那个文件一起带进来，最多四层。
[[instructions]]
scope = "global"
names = ["/Library/Application Support/ClaudeCode/CLAUDE.md", "~/.claude/CLAUDE.md"]
import-depth = 4

[[instructions]]
scope = "project"
names = ["CLAUDE.md", ".claude/CLAUDE.md", "CLAUDE.local.md"]
walk = "ancestors"
fallback = ["AGENTS.md", ".claude/AGENTS.md"]
personal = ["CLAUDE.local.md"]
import-depth = 4

[[rules]]
scope = "global"
dir = "~/.claude/rules"

[[rules]]
scope = "project"
dir = ".claude/rules"

# ── MCP ──
# 三层：local 存在 ~/.claude.json 的 projects.<项目路径>.mcpServers，只属于你，对应方寸的个人层；
# project 是 .mcp.json；user 是 ~/.claude.json 的 mcpServers。

[[mcp]]
scope = "global"
file = "~/.claude.json"
format = "json"
key = ["mcpServers"]

[[mcp]]
scope = "project"
file = ".mcp.json"
format = "json"
key = ["mcpServers"]

[[mcp]]
scope = "personal"
file = "~/.claude.json"
format = "json"
key = ["projects", "{project}", "mcpServers"]

[mcp-fields]
command = "command"
args = "args"
env = "env"
url = "url"
# mcp 文档（2026-11-21 核实）：command、args、env、url、headers 里可以写 ${VAR} 或 ${VAR:-default}，
# 变量没设又没有默认值时照原样传。用了 secret: 的服务，.mcp.json 的 env 写成 ${变量名}（M1-17）。
env-reference = { prefix = "${", suffix = "}" }

[precedence]
# skills 文档：「Enterprise over personal, and personal over project」。全局盖过项目。
skills = ["global", "project"]
# mcp 文档：local > project > user，整条取用，字段不跨层合并。
mcp = ["personal", "project", "global"]

# ── 其他加载项（只看不管）──

[[observed]]
kind = "plugin"
scope = "global"
file = "~/.claude/settings.json"
format = "json"
key = ["enabledPlugins"]
# 插件的安装目录记在 installed_plugins.json（对照本机文件核实，文档没有写这个文件）。
# skills 文档：插件的 skill 在 <插件>/skills/<名称>/SKILL.md。
# plugins-reference：插件根目录的 .mcp.json（服务放顶层或包在 mcpServers 里，本机插件两种都有），
# 再加 .claude-plugin/plugin.json 的 mcpServers（内联、JSON 路径、.mcpb 包或数组），同名后者替换前者。
install-index = { file = "~/.claude/plugins/installed_plugins.json", format = "json", key = ["plugins"], path-field = "installPath", skills-dir = "skills", mcp-file = ".mcp.json", manifest = ".claude-plugin/plugin.json" }

[[observed]]
kind = "hook"
scope = "global"
file = "~/.claude/settings.json"
format = "json"
key = ["hooks"]

[[observed]]
kind = "hook"
scope = "project"
file = ".claude/settings.json"
format = "json"
key = ["hooks"]

[[observed]]
kind = "hook"
scope = "personal"
file = ".claude/settings.local.json"
format = "json"
key = ["hooks"]

[[observed]]
kind = "slash-command"
scope = "global"
dir = "~/.claude/commands"

[[observed]]
kind = "slash-command"
scope = "project"
dir = ".claude/commands"

[[observed]]
kind = "subagent"
scope = "global"
dir = "~/.claude/agents"

[[observed]]
kind = "subagent"
scope = "project"
dir = ".claude/agents"

# ── skill 开关 ──
# skills 文档（2026-11-21 核实）：skillOverrides 可以写在任何设置文件里，值是 on、name-only、
# user-invocable-only、off；用户、项目、本地设置里只按名字匹配，不在表里的算 on。
# off 和 user-invocable-only 都不让 Claude 看到，按不进上下文算。按项目停用（7.4）写 off。

[[skill-switches]]
scope = "global"
file = "~/.claude/settings.json"
format = "json"
key = ["skillOverrides"]
shape = "map"
off-values = ["off", "user-invocable-only"]

[[skill-switches]]
scope = "project"
file = ".claude/settings.json"
format = "json"
key = ["skillOverrides"]
shape = "map"
off-values = ["off", "user-invocable-only"]

[[skill-switches]]
scope = "personal"
file = ".claude/settings.local.json"
format = "json"
key = ["skillOverrides"]
shape = "map"
off-values = ["off", "user-invocable-only"]

# ── MCP 开关 ──
# mcp 文档（2026-11-21 核实）：/mcp 里的开关按项目记在 ~/.claude.json 的 disabledMcpServers，
# 管用户层、本地层的服务；项目 .mcp.json 里的服务另用 disabledMcpjsonServers，这里不写。
# 能提交的按项目开关文档里没有，按项目停用全局 MCP 写这里，只在本机生效（9.3）。

[[mcp-switches]]
scope = "personal"
file = "~/.claude.json"
format = "json"
key = ["projects", "{project}", "disabledMcpServers"]
applies-to = ["global", "personal"]

# ── 会话记录 ──

[sessions]
dir = "~/.claude/projects"
format = "claude-code-jsonl"
