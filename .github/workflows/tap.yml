name: 更新 Homebrew tap

# Release 由人点「Publish release」后，把新版本和哈希写进 luzhengli/homebrew-fangcun（R-03、9.3）。
# 推送用 Secret TAP_TOKEN：只对 tap 仓库有 Contents 读写权限的 fine-grained token，由人建（H-16）。
# 也可以手动跑：Actions → 更新 Homebrew tap → Run workflow，填标签。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 标签，例如 v0.1.0
        required: true

permissions:
  contents: read

jobs:
  tap:
    name: 写 formula 和 cask
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TAP_REPO: luzhengli/homebrew-fangcun
    steps:
      - uses: actions/checkout@v4

      - name: 有没有 TAP_TOKEN
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::error::缺 Secret TAP_TOKEN，见 BACKLOG H-16。"
            exit 1
          fi

      - name: 版本与哈希
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          src=$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz" | sha256sum | cut -d' ' -f1)
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          dmg=$(grep "Fangcun-${v}-macos-universal.dmg" "$RUNNER_TEMP/SHA256SUMS" | cut -d' ' -f1)
          if [ -z "${src}" ] || [ -z "${dmg}" ]; then
            echo "::error::取不到源码包或 dmg 的哈希"
            exit 1
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "src=${src}" >> "$GITHUB_OUTPUT"
          echo "dmg=${dmg}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: 写入并推送
        run: |
          v="${{ steps.sums.outputs.version }}"
          mkdir -p tap/Formula tap/Casks
          sed -e "s/{{VERSION}}/${v}/g" -e "s/{{SOURCE_SHA256}}/${{ steps.sums.outputs.src }}/g" \
            packaging/homebrew/fangcun.rb.tmpl > tap/Formula/fangcun.rb
          sed -e "s/{{VERSION}}/${v}/g" -e "s/{{DMG_SHA256}}/${{ steps.sums.outputs.dmg }}/g" \
            packaging/homebrew/fangcun-cask.rb.tmpl > tap/Casks/fangcun.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/fangcun.rb Casks/fangcun.rb
          if git diff --cached --quiet; then
            echo "tap 已是 ${v}"
            exit 0
          fi
          git commit -m "fangcun ${v}"
          git push
