          <button type="button" class="fc-h" aria-label="新建套装" title="新建套装" style="width: 32px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--tx-2);"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button>

        <button type="button" class="fc-btn" style="display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 30px; margin-bottom: 10px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--tx-1);"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>新建套装</button>
        <div style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 2px 0 10px; margin-bottom: 2px;">
          <span style="flex: 1; font-size: 11px; font-weight: 600; color: var(--tx-3);">全部套装 · 3</span>
          <button type="button" class="fc-h" onClick="{{toggleList}}" aria-label="折叠套装列表" aria-expanded="true" style="width: 28px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 5px; background: transparent; color: var(--tx-2);"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2"></rect><path d="M6.5 2.5v11"></path><path d="m11 6.5-1.5 1.5 1.5 1.5"></path></svg></button>

              <span style="font-family: var(--mono); font-size: 11px; color: var(--tx-3);">{{b.cost}}</span>
            </span>
            <span style="font-size: 11px; color: var(--tx-3);">{{b.assetCount}} 项 · {{b.projCount}} 个项目</span>
          </button>

      <aside aria-label="套装详情" class="fc-col" style="flex: 999 1 460px; min-width: 0; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 20px;">

          <span style="font-family: var(--mono); font-size: 11px; color: var(--tx-3);">bundles = ["{{d.name}}"]</span>

                  <th scope="col" style="padding: 6px 12px; text-align: right; font-size: 11px; font-weight: 500; color: var(--tx-3);">常驻</th>

                    <td style="padding: 8px 12px; font-family: var(--mono); font-size: 11px; color: var(--tx-2);">{{a.ver}}</td>

      </aside>

  </div>

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"外观"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const BASE = {
      eng: ['evals_studio', 'agent-lab', 'fangcun'],
      fe: ['blog-site', 'client-acme'],
      lark: ['client-acme']
    };
    const s = Object.assign({ sel: 'eng', use: null, base: null, applied: false, explain: false, listOpen: true, navC: false }, this.state || {});
    const baseAll = s.base || BASE;
    const use = s.use || { eng: baseAll.eng.slice(), fe: baseAll.fe.slice(), lark: baseAll.lark.slice() };
    const set = (o) => this.setState(o);
    const dark = this.props.dark ?? false;
    const PROJECTS = ['evals_studio', 'agent-lab', 'fangcun', 'blog-site', 'notes-kit', 'client-acme'];
    const A = (name, kind, ver, cost) => ({ name, kind, ver, cost });
    const B = [
      { id: 'eng', name: '工程基线', blurb: '所有写代码的项目都要的那几样：测试流程、工程规范、GitHub。', cost: '6.1k',
        assets: [A('tdd', 'Skill', '跟随 main', '0.2k'), A('AGENTS.md 工程基线', '指令片段', '固定 5e2a7c1', '1.1k'), A('github', 'MCP 服务', 'npx 启动', '4.8k')] },
      { id: 'fe', name: '前端基线', blurb: '前端项目共用的视觉规范与组件约定。', cost: '0.5k',
        assets: [A('frontend-design', 'Skill', '固定 v1.3.0', '0.2k'), A('skill-b', 'Skill', '固定 v2.1.0', '0.3k')] },
      { id: 'lark', name: '飞书办公', blurb: '由体检建议从全局层转来：只给真正要用飞书的项目。', cost: '6.4k',
        assets: [A('lark-doc', 'Skill', '跟随 main', '0.4k'), A('lark-sheet', 'Skill', '跟随 main', '0.4k'), A('lark-base', 'Skill', '跟随 main', '0.4k'), A('…另外 13 项', 'Skill', '跟随 main', '5.2k')] }
    ];
    const bundles = B.map((b) => {
      const on = s.sel === b.id;
      return { name: b.name, blurb: b.blurb, cost: b.cost, assetCount: b.id === 'lark' ? 16 : b.assets.length, projCount: use[b.id].length, on,
        pick: () => set({ sel: b.id, applied: false }),
        initial: b.name.charAt(0),
        miniStyle: 'width: 32px; height: 32px; border-radius: 6px; font-size: 13px; font-weight: 600; ' + (on ? 'border: 1px solid var(--accent); background: var(--accent-weak); color: var(--accent);' : 'border: 1px solid var(--line); background: var(--bg); color: var(--tx-2);'),
        rowStyle: 'display: flex; flex-direction: column; align-items: flex-start; gap: 0; width: 100%; padding: 6px 10px; border: 0; border-radius: 6px; text-align: left; color: var(--tx-1); box-sizing: border-box;' + (on ? ' background: var(--bg-selected);' : ' background: transparent;') };
    });
    const cur = B.find((b) => b.id === s.sel) || B[0];
    const now = use[cur.id];
    const base = baseAll[cur.id];
    const added = now.filter((p) => base.indexOf(p) < 0);
    const removed = base.filter((p) => now.indexOf(p) < 0);
    const projects = PROJECTS.map((p) => {
      const on = now.indexOf(p) >= 0;
      const isAdd = added.indexOf(p) >= 0, isRem = removed.indexOf(p) >= 0;
      const tag = isAdd ? '将加入' : (isRem ? '将移除' : '');
      return { name: p, on, tag,
        toggle: () => {
          const nu = Object.assign({}, use); const list = nu[cur.id].slice();
          const i = list.indexOf(p); if (i >= 0) list.splice(i, 1); else list.push(p);
          nu[cur.id] = list; set({ use: nu, applied: false });
        },
        style: 'display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; border-radius: 6px; cursor: pointer; ' + (on ? 'border: 1px solid var(--accent); background: var(--accent-weak);' : 'border: 1px solid var(--line); background: var(--bg);'),
        tagStyle: 'font-size: 11px; ' + (isAdd ? 'color: var(--ok);' : (isRem ? 'color: var(--danger);' : 'display: none;')) };
    });
    const parts = [];
    if (added.length) parts.push('加入 ' + added.join('、'));
    if (removed.length) parts.push('从 ' + removed.join('、') + ' 移除');
    const d = { name: cur.name, blurb: cur.blurb, assets: cur.assets, projects,
      hasPending: parts.length > 0,
      pendingText: '将把「' + cur.name + '」' + parts.join('，') + '。每个项目常驻约 ' + (added.length ? '+' : '−') + cur.cost + '（估算）。' };
    const marks = (i) => [0, 1, 2, 3].map((k) => ({ s: 'width: 6px; height: 6px; border-radius: 1.5px; box-sizing: border-box; ' + (k === i ? 'background: var(--accent);' : 'border: 1px solid var(--line-strong);') }));
    const LY = [['全局', '每个项目都加载'], ['套装', '你挑选的项目才加载'], ['项目', '只写在本项目清单'], ['个人', '只在你的机器上']];
    const layers = LY.map(([name, desc], i) => ({ name, desc, marks: marks(i),
      style: 'display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; ' + (i === 1 ? 'background: var(--bg); border: 1px solid var(--accent); color: var(--tx-1);' : 'border: 1px solid transparent; color: var(--tx-2);') }));
    return { rootClass: 'fc fc-shell' + (dark ? ' dark' : ''), bundles, d, layers, applied: s.applied,
      navClass: s.navC ? 'fc-navc' : '', navLabel: s.navC ? '展开侧栏' : '折叠侧栏', navExpanded: !s.navC, toggleNav: () => set({ navC: !s.navC }),
      navBtnStyle: 'width: 28px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; color: var(--tx-2); background: ' + (s.navC ? 'transparent' : 'var(--bg-hover)') + ';',
      listOpen: s.listOpen, listClosed: !s.listOpen, toggleList: () => set({ listOpen: !s.listOpen }),
      explainOpen: s.explain, explainLabel: s.explain ? '收起说明' : '什么是套装？', toggleExplain: () => set({ explain: !s.explain }),
      reset: () => { const nu = Object.assign({}, use); nu[cur.id] = base.slice(); set({ use: nu }); },
      apply: () => { const nb = Object.assign({}, baseAll); nb[cur.id] = now.slice(); set({ applied: true, base: nb, use: null }); } };
  }
}
</script>
</body>
