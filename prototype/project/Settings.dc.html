<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方寸 · 设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.fc{--bg:#FFFFFF;--bg-sidebar:#F2F2F0;--bg-subtle:#F8F8F6;--bg-hover:#EDEDEA;--bg-selected:#E8EDFC;--veil:rgba(0,0,0,.04);--line:#E6E6E2;--line-strong:#D0D0CB;--tx-1:#1D1D1F;--tx-2:#55555A;--tx-3:#6B6B70;--accent:#3552D4;--accent-weak:#ECF0FD;--on-accent:#FFFFFF;--bar-1:#3552D4;--bar-2:#8FA3EC;--bar-3:#C9D3F6;--ok:#1B7A43;--ok-dot:#2EA457;--ok-weak:#E7F5EC;--warn:#985200;--warn-dot:#E58A00;--warn-weak:#FDF1E0;--info:#3552D4;--info-dot:#4C6EF5;--info-weak:#ECF0FD;--danger:#BA2D28;--danger-dot:#E5484D;--danger-weak:#FCEBEA;--unknown:#6B43C2;--unknown-dot:#8E62F0;--unknown-weak:#F2EDFD;--muted-dot:#A3A3A8;--code-bg:#F4F4F2;--add-bg:#E3F4E8;--del-bg:#FBE7E6;--shadow-pop:0 16px 40px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.06);--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",Inter,"Noto Sans SC","Helvetica Neue",sans-serif;--mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace}
.fc.dark{--bg:#1C1C1E;--bg-sidebar:#232325;--bg-subtle:#202022;--bg-hover:#2A2A2D;--bg-selected:#27304F;--veil:rgba(255,255,255,.05);--line:#323235;--line-strong:#46464B;--tx-1:#ECECEE;--tx-2:#B0B0B6;--tx-3:#93939A;--accent:#7D93FF;--accent-weak:#252D4A;--on-accent:#0F1530;--bar-1:#7D93FF;--bar-2:#4E62B8;--bar-3:#323E74;--ok:#5BCB85;--ok-weak:#17301F;--warn:#F2A33A;--warn-weak:#33260F;--info:#8DA2FF;--info-weak:#232B48;--danger:#FF7B76;--danger-weak:#3A1D1C;--unknown:#B394FF;--unknown-weak:#2B2240;--code-bg:#252527;--add-bg:#173020;--del-bg:#3A1D1C;--shadow-pop:0 16px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)}
.fc button{font:inherit;cursor:pointer}
.fc input{font:inherit}
.fc :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fc-h:hover{box-shadow:inset 0 0 0 999px var(--veil)}
.fc-btn:hover{filter:brightness(.95)}
.fc.dark .fc-btn:hover{filter:brightness(1.15)}
.fc a{color:var(--accent)}
.fc a:hover{color:var(--tx-1)}
.fc-navbtn{margin-left:auto}
.fc-navc{flex:0 0 56px!important;padding-left:8px!important;padding-right:8px!important}
.fc-navc>div>a,.fc-navc>div>div{justify-content:center;padding-left:0!important;padding-right:0!important}
.fc-navc>div:first-child{display:none!important}
.fc-hidden{display:none!important}
.fc-navc .fc-navbtn{margin-left:0}
.fc-navc a span,.fc-navc>div>div>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fc-navc .fc-navhide{display:none!important}
.fc-shell{height:100vh;min-height:640px;overflow:hidden}
.fc-col{overflow-y:auto;min-height:0;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;scrollbar-gutter:stable}
@media (max-width: 900px){.fc-shell{height:auto;overflow:visible;flex-wrap:wrap!important}.fc-split{flex-wrap:wrap!important}.fc-col{overflow:visible}}
.fc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="{{rootClass}}" style="position: relative; display: flex; flex-direction: column; background: var(--bg); color: var(--tx-1); font-family: var(--font); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased;">

  <!-- 窗口工具栏：和其他页面同一条 -->
  <div role="toolbar" aria-label="窗口工具栏" style="flex: 0 0 auto; display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 12px; box-sizing: border-box; background: var(--bg-sidebar); border-bottom: 1px solid var(--line);">
    <span aria-hidden="true" style="display: inline-flex; gap: 8px; margin-right: 16px;"><span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57;"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E;"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840;"></span></span>
    <a href="Main.dc.html" class="fc-h" aria-label="后退" title="后退" style="width: 28px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--tx-2);"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7 4 3 8l4 4"></path></svg></a>
    <button type="button" disabled="" aria-label="前进" style="width: 28px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--tx-3); opacity: .55; cursor: default;"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"></path></svg></button>
    <button type="button" class="fc-h" onClick="{{toggleNav}}" aria-label="{{navLabel}}" aria-expanded="{{navExpanded}}" title="{{navLabel}}" style="{{navBtnStyle}}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2"></rect><path d="M6.5 2.5v11"></path></svg></button>
    <span style="flex: 1;"></span>
  </div>

  <div class="fc-split" style="flex: 1; display: flex; flex-wrap: nowrap; min-height: 0;">

    <!-- 导航：进设置时折成图标栏 -->
    <nav aria-label="主导航" class="fc-col" style="{{railStyle}}">
      <a href="Main.dc.html" class="fc-h" title="项目" style="{{navItemStyle}}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--tx-2);"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.4 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"></path></svg>
        <span class="{{labelClass}}" style="flex: 1;">项目</span>
      </a>
      <a href="Library.dc.html" class="fc-h" title="资产库" style="{{navItemStyle}}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--tx-2);"><path d="M2.5 5 8 2.5 13.5 5v6L8 13.5 2.5 11z"></path><path d="M2.5 5 8 7.5 13.5 5M8 7.5v6"></path></svg>
        <span class="{{labelClass}}" style="flex: 1;">资产库</span>
      </a>
      <a href="Bundles.dc.html" class="fc-h" title="套装" style="{{navItemStyle}}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--tx-2);"><path d="M8 2.5 14 5.5 8 8.5 2 5.5z"></path><path d="M2 8.5l6 3 6-3"></path></svg>
        <span class="{{labelClass}}" style="flex: 1;">套装</span>
      </a>
      <a href="Global.dc.html" class="fc-h" title="全局" style="{{navItemStyle}}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="flex: none; color: var(--tx-2);"><circle cx="8" cy="8" r="5.5"></circle><path d="M2.5 8h11M8 2.5c1.6 1.7 2.4 3.5 2.4 5.5S9.6 11.8 8 13.5C6.4 11.8 5.6 10 5.6 8S6.4 4.2 8 2.5z"></path></svg>
        <span class="{{labelClass}}" style="flex: 1;">全局</span>
      </a>
      <a href="Activity.dc.html" class="fc-h" title="活动" style="{{navItemStyle}}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="flex: none; color: var(--tx-2);"><circle cx="8" cy="8" r="5.5"></circle><path d="M8 5v3l2 1.5"></path></svg>
        <span class="{{labelClass}}" style="flex: 1;">活动</span>
      </a>
      <a href="Settings.dc.html" aria-current="page" class="fc-h" title="设置（⌘,）" style="{{settingsStyle}}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--accent);"><circle cx="8" cy="8" r="2"></circle><path d="M8 1.75v1.5M8 12.75v1.5M1.75 8h1.5M12.75 8h1.5M3.6 3.6l1.05 1.05M11.35 11.35l1.05 1.05M3.6 12.4l1.05-1.05M11.35 4.65l1.05-1.05"></path><circle cx="8" cy="8" r="4.5"></circle></svg>
        <span class="{{labelClass}}" style="flex: 1;">设置</span>
      </a>
      <a href="Checkup.dc.html" class="fc-h" title="重新体检" style="{{checkupStyle}}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--tx-2);"><path d="M1.5 8h3l1.5-3.5 3 7 1.5-3.5h4"></path></svg>
        <span class="{{labelClass}}">重新体检</span>
      </a>
    </nav>

    <!-- 设置目录 -->
    <aside aria-label="设置目录" class="fc-col" style="flex: 0 0 216px; box-sizing: border-box; background: var(--bg-sidebar); border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 12px;">
      <h1 style="margin: 0; padding: 0 8px; font-size: 15px; font-weight: 600;">设置</h1>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <button type="button" aria-current="page" class="fc-h" style="width: 100%; border: 0; text-align: left; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 6px; background: var(--bg-hover); color: var(--tx-1); text-decoration: none; font-weight: 500;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--accent);"><circle cx="8" cy="8" r="2"></circle><path d="M8 1.75v1.5M8 12.75v1.5M1.75 8h1.5M12.75 8h1.5M3.6 3.6l1.05 1.05M11.35 11.35l1.05 1.05M3.6 12.4l1.05-1.05M11.35 4.65l1.05-1.05"></path><circle cx="8" cy="8" r="4.5"></circle></svg>
          <span>通用</span>
        </button>
      </div>
    </aside>

    <!-- 设置内容 -->
    <main id="general" class="fc-col" style="flex: 1 1 560px; min-width: 0; box-sizing: border-box; padding: 40px 32px 48px;">
      <div style="max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;">
        <h2 style="margin: 0 0 18px; font-size: 22px; font-weight: 600;">通用</h2>

        <h3 style="margin: 0; font-size: 13px; font-weight: 600;">写入</h3>
        <div style="border-radius: 10px; background: var(--bg-subtle); border: 1px solid var(--line);">
          <div style="display: flex; align-items: center; gap: 24px; padding: 14px 16px;">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span id="ro-label" style="font-weight: 500;">只读模式</span>
              <span style="font-size: 12px; color: var(--tx-2);">打开后拒绝一切写入，只记体检。命令行同款：<span style="font-family: var(--mono); font-size: 11px;">fangcun --read-only &lt;命令&gt;</span></span>
            </div>
            <button type="button" role="switch" aria-checked="{{roChecked}}" aria-labelledby="ro-label" onClick="{{toggleRo}}" style="{{switchStyle}}"><span aria-hidden="true" style="{{knobStyle}}"></span></button>
          </div>
        </div>

        <h3 style="margin: 22px 0 0; font-size: 13px; font-weight: 600;">快照</h3>
        <div style="border-radius: 10px; background: var(--bg-subtle); border: 1px solid var(--line);">
          <div style="display: flex; align-items: center; gap: 24px; padding: 14px 16px; border-bottom: 1px solid var(--line);">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <label for="days" style="font-weight: 500;">保留天数</label>
              <span style="font-size: 12px; color: var(--tx-2);">快照和它的备份保留多久。过期后记录仍在，回滚按钮置灰。</span>
            </div>
            <span style="display: inline-flex; align-items: center; gap: 8px;">
              <input id="days" type="number" min="1" max="365" value="{{days}}" onChange="{{onDays}}" style="width: 64px; height: 26px; box-sizing: border-box; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--tx-1); text-align: right; font-variant-numeric: tabular-nums;">
              <span style="width: 14px; color: var(--tx-2);">天</span>
            </span>
          </div>
          <div style="display: flex; align-items: center; gap: 24px; padding: 14px 16px;">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <label for="keep" style="font-weight: 500;">每个项目至少保留</label>
              <span style="font-size: 12px; color: var(--tx-2);">{{keepNote}}</span>
            </div>
            <span style="display: inline-flex; align-items: center; gap: 8px;">
              <input id="keep" type="number" min="1" max="500" value="{{keep}}" onChange="{{onKeep}}" style="width: 64px; height: 26px; box-sizing: border-box; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--tx-1); text-align: right; font-variant-numeric: tabular-nums;">
              <span style="width: 14px; color: var(--tx-2);">个</span>
            </span>
          </div>
        </div>

        <p style="margin: 18px 0 0; font-size: 12px; color: var(--tx-3);">设置存在 <span style="font-family: var(--mono); font-size: 11px;">~/.fangcun/settings.toml</span>，可以手改。</p>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"外观"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = Object.assign({ ro: false, days: 30, keep: 20, navOpen: false }, this.state || {});
    const set = (o) => this.setState(o);
    const dark = this.props.dark ?? false;
    const num = (v, d) => { const n = parseInt(v, 10); return n > 0 ? n : d; };
    const open = s.navOpen;
    return {
      rootClass: 'fc fc-shell' + (dark ? ' dark' : ''),
      // 进设置时导航折成 56px 图标栏；工具栏的侧栏开关可以临时展开。
      railStyle: 'flex: 0 0 ' + (open ? '216px' : '56px') + '; box-sizing: border-box; background: var(--bg-sidebar); border-right: 1px solid var(--line); padding: 12px ' + (open ? '10px' : '8px') + ' 16px; display: flex; flex-direction: column; gap: 1px;',
      navItemStyle: 'display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 ' + (open ? '8px' : '0') + '; border-radius: 6px; color: var(--tx-1); text-decoration: none;' + (open ? '' : ' justify-content: center;'),
      settingsStyle: 'margin-top: auto; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 ' + (open ? '8px' : '0') + '; border-radius: 6px; background: var(--bg-hover); color: var(--tx-1); text-decoration: none; font-weight: 500;' + (open ? '' : ' justify-content: center;'),
      checkupStyle: 'margin-top: 6px; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 ' + (open ? '8px' : '0') + '; border-radius: 6px; color: var(--tx-1); text-decoration: none;' + (open ? '' : ' justify-content: center;'),
      labelClass: open ? '' : 'fc-sr',
      navLabel: open ? '折叠侧栏' : '展开侧栏', navExpanded: open ? 'true' : 'false',
      navBtnStyle: 'width: 28px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; color: var(--tx-2); background: ' + (open ? 'var(--bg-hover)' : 'transparent') + ';',
      toggleNav: () => set({ navOpen: !open }),
      roChecked: s.ro ? 'true' : 'false',
      toggleRo: () => set({ ro: !s.ro }),
      switchStyle: 'flex: none; position: relative; width: 38px; height: 22px; padding: 0; border: 0; border-radius: 11px; transition: background .15s; background: ' + (s.ro ? 'var(--accent)' : 'var(--line-strong)') + ';',
      knobStyle: 'position: absolute; top: 2px; left: ' + (s.ro ? '18px' : '2px') + '; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s;',
      days: s.days, keep: s.keep,
      onDays: (e) => set({ days: num(e.target.value, 30) }),
      onKeep: (e) => set({ keep: num(e.target.value, 20) }),
      keepNote: '超过 ' + s.days + ' 天也不清理，每个项目留下最近的这么多个。'
    };
  }
}
</script>
</body>
</html>
