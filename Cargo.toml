[workspace]
resolver = "3"
members = ["crates/fangcun-core", "crates/fangcun-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
repository = "https://github.com/luzhengli/Fangcun"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fangcun-core = { path = "crates/fangcun-core" }

serde = { version = "1", features = ["derive"] }
# 资产库索引（7.2）。bundled：自带 SQLite，不依赖系统库。
rusqlite = { version = "0.43", features = ["bundled"] }
# preserve_order：按键合并 .mcp.json 时保住原来的键顺序（4.6 第 5 条）。
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
toml = "1"
# 按键合并 .codex/config.toml，保住人写的注释和顺序（4.6 第 5 条）。
toml_edit = "0.25"
ts-rs = "12"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# 骨架里未实现的地方一律返回 Error::NotImplemented，不用会 panic 的宏。
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
